apiVersion: v2
name: yipyap-source
description: YipYapSource CRD + controller for the Knative Eventing source.
type: application
version: 1.1.1
appVersion: 1.1.1
home: https://yipyap.run
sources:
  - https://github.com/YipYap-run/knative-source
icon: https://yipyap.run/icon.png
keywords:
  - yipyap
  - knative
  - cloudevents
  - eventing
  - source
  - observability
maintainers:
  - name: YipYap
    url: https://yipyap.run
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - Bidirectional reply support: the controller stamps the receive
      adapter image at appVersion to consume reply CloudEvents from
      the configured sink.
    - Chart hardening: CRD schema rejects unknown fields at the
      apiserver; controller no longer reads cluster-wide Secrets;
      scopedNamespaces narrows the ClusterRole when set; NetworkPolicy
      default-denies metrics ingress unless labels are configured;
      both deployments run under the PSS-restricted profile with
      seccomp and readOnlyRootFilesystem.
    - Webhook HA: replicas=2 plus a PodDisruptionBudget so
      failurePolicy=Fail does not make the webhook a single point of
      failure during rolling updates.
    - Tag-driven release workflow with Chart.yaml/tag lockstep
      enforcement.
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.yipyap.run/integrations/knative/source-crd/
