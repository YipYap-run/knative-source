apiVersion: v2
name: yipyap-source
description: YipYapSource CRD + controller for the Knative Eventing source.
type: application
version: 1.1.1
appVersion: 1.1.1
home: https://yipyap.run
sources:
  - https://github.com/YipYap-run/knative-source
icon: https://yipyap.run/icon.png
keywords:
  - yipyap
  - knative
  - cloudevents
  - eventing
  - source
  - observability
maintainers:
  - name: YipYap
    url: https://yipyap.run
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/changes: |
    - CRD schema rejects unknown fields at the apiserver.
    - The controller never reads Secrets; scopedNamespaces limits
      Deployment writes to the listed namespaces while reads stay
      cluster-wide.
    - NetworkPolicy is on by default. Set networkPolicy.apiServerCIDRs
      or the install fails with a message naming the value.
    - spec.baseURL must be https and on the operator allowlist
      (webhook.allowedBaseURLHosts, default console.yipyap.run), and
      the requesting user must be able to read the API key Secret.
    - Both deployments run under the PSS-restricted profile with
      seccomp and readOnlyRootFilesystem.
    - Webhook HA: replicas=2 plus a PodDisruptionBudget so
      failurePolicy=Fail does not make the webhook a single point of
      failure during rolling updates.
    - Tag-driven release workflow with Chart.yaml/tag lockstep
      enforcement.
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.yipyap.run/integrations/knative/source-crd/
