{{- if .Values.installCRD }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: yipyapsources.sources.yipyap.run
  labels:
    {{- include "yipyap-source.labels" . | nindent 4 }}
    eventing.knative.dev/source: "true"
    knative.dev/crd-install: "true"
  annotations:
    registry.knative.dev/eventTypes: |
      [
        { "type": "dev.yipyap.source" }
      ]
spec:
  group: sources.yipyap.run
  names:
    categories:
      - all
      - knative
      - eventing
      - sources
    kind: YipYapSource
    plural: yipyapsources
    singular: yipyapsource
    shortNames:
      - yys
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          # Static schema floor (security-review A5-NEW-1). Unknown fields are
          # rejected at apiserver-side validation, even when the admission
          # webhook is unavailable / failurePolicy=Ignore. The webhook
          # (yipyapsource_validation.go + yipyapsource_defaults.go) still runs
          # for cross-field semantics not expressible in OpenAPI.
          type: object
          required: [spec]
          additionalProperties: false
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [apiKeyRef]
              additionalProperties: false
              properties:
                apiKeyRef:
                  type: object
                  required: [name]
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      # Kubernetes Secret name: RFC 1123 DNS subdomain.
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                    key:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[A-Za-z0-9._-]+$'
                baseURL:
                  type: string
                  maxLength: 2048
                  # Require an http(s) scheme; permissive on host since the
                  # webhook performs SSRF + private-target validation.
                  pattern: '^https?://[^\s]+$'
                mode:
                  type: string
                  enum: ["", auto, poll, stream]
                serviceAccountName:
                  type: string
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                filter:
                  type: object
                  additionalProperties: false
                  properties:
                    types:
                      type: array
                      maxItems: 1024
                      items:
                        type: string
                        minLength: 1
                        maxLength: 256
                    monitorIDs:
                      type: array
                      maxItems: 1024
                      items:
                        type: string
                        minLength: 1
                        maxLength: 256
                    severities:
                      type: array
                      maxItems: 8
                      items:
                        type: string
                        enum: [info, warning, critical]
                # Embedded duck-type fields from knative.dev/pkg/apis/duck/v1
                # SourceSpec. These are well-formed Kubernetes destinations
                # whose internal shape is governed by upstream Knative;
                # preserve unknown fields ONLY inside this subtree so the
                # outer spec stays strictly bounded.
                sink:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                ceOverrides:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: ".status.conditions[?(@.type=='Ready')].status"
        - name: Reason
          type: string
          jsonPath: ".status.conditions[?(@.type=='Ready')].reason"
        - name: Sink
          type: string
          jsonPath: .status.sinkUri
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
{{- end }}
