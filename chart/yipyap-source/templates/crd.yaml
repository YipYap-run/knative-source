{{- if .Values.installCRD }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: yipyapsources.sources.yipyap.run
  labels:
    {{- include "yipyap-source.labels" . | nindent 4 }}
    eventing.knative.dev/source: "true"
    knative.dev/crd-install: "true"
  annotations:
    registry.knative.dev/eventTypes: |
      [
        { "type": "dev.yipyap.source" }
      ]
spec:
  group: sources.yipyap.run
  names:
    categories:
      - all
      - knative
      - eventing
      - sources
    kind: YipYapSource
    plural: yipyapsources
    singular: yipyapsource
    shortNames:
      - yys
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          # Pending full OpenAPI schema; SetDefaults/Validate run via the
          # admission webhook.
          x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: ".status.conditions[?(@.type=='Ready')].status"
        - name: Reason
          type: string
          jsonPath: ".status.conditions[?(@.type=='Ready')].reason"
        - name: Sink
          type: string
          jsonPath: .status.sinkUri
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
{{- end }}
