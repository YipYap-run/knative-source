apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "yipyap-source.webhookServiceAccountName" . }}-rolebinding
  labels:
    {{- include "yipyap-source.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "yipyap-source.webhookServiceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "yipyap-source.webhookServiceAccountName" . }}
    namespace: {{ include "yipyap-source.namespace" . }}
