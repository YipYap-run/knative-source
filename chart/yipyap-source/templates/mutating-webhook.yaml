apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: defaulting.webhook.sources.yipyap.run
  labels:
    {{- include "yipyap-source.labels" . | nindent 4 }}
webhooks:
  - name: defaulting.webhook.sources.yipyap.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: {{ .Values.webhook.failurePolicy }}
    timeoutSeconds: 10
    clientConfig:
      service:
        name: yipyap-source-webhook
        namespace: {{ include "yipyap-source.namespace" . }}
        path: /defaulting
    rules:
      - apiGroups:   ["sources.yipyap.run"]
        apiVersions: ["v1alpha1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["yipyapsources"]
        scope:       "Namespaced"
