apiVersion: apps/v1
kind: Deployment
metadata:
  name: yipyap-source-controller
  namespace: {{ include "yipyap-source.namespace" . }}
  labels:
    {{- include "yipyap-source.labels" . | nindent 4 }}
    control-plane: yipyap-source-controller-manager
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app: yipyap-source-controller
      control-plane: yipyap-source-controller-manager
  template:
    metadata:
      labels:
        {{- include "yipyap-source.labels" . | nindent 8 }}
        app: yipyap-source-controller
        control-plane: yipyap-source-controller-manager
    spec:
      serviceAccountName: {{ include "yipyap-source.controllerServiceAccountName" . }}
      # Pod-level security baseline: the pod runs
      # as nonroot, drops all capabilities at the container level, and
      # applies the host's RuntimeDefault seccomp profile so the workload
      # passes Kubernetes Pod Security Standard "restricted".
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      # Spread replicas to avoid a single-node SPOF.
      affinity:
        {{- with .Values.controller.affinity }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: yipyap-source-controller
                topologyKey: kubernetes.io/hostname
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ include "yipyap-source.controllerImage" . }}
          imagePullPolicy: {{ .Values.images.controller.pullPolicy }}
          terminationMessagePolicy: FallbackToLogsOnError
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          env:
            - name: SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_LOGGING_NAME
              value: config-logging
            - name: CONFIG_OBSERVABILITY_NAME
              value: config-observability
            - name: METRICS_DOMAIN
              value: knative.dev/sources
            - name: YIPYAP_SOURCE_RA_IMAGE
              value: {{ include "yipyap-source.adapterImage" . }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            {{- end }}
