apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "yipyap-source.controllerServiceAccountName" . }}
  labels:
    {{- include "yipyap-source.labels" . | nindent 4 }}
rules:
  # Namespaced reconcile-target verbs: when controller.scopedNamespaces is
  # empty, grant cluster-wide on Deployments + ConfigMaps so the controller
  # can reconcile receive-adapter Pods + read observability ConfigMaps in
  # any namespace (canonical Knative-source posture). When scopedNamespaces
  # is set, these grants live ONLY in the per-namespace Roles emitted by
  # scoped-roles.yaml, leaving the ClusterRole free of cluster-wide
  # apps/deployments and core/configmaps verbs
  #  previously additive Roles still left the ClusterRole
  # cluster-wide; now they're an exclusive narrowing).
  {{- if not .Values.controller.scopedNamespaces }}
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  {{- end }}

  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["list"]

  - apiGroups: [""]
    resources: ["events"]
    verbs: &everything ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["sources.yipyap.run"]
    resources: ["yipyapsources"]
    verbs: *everything

  - apiGroups: ["sources.yipyap.run"]
    resources: ["yipyapsources/status", "yipyapsources/finalizers"]
    verbs: ["get", "update", "patch"]

  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: *everything

# Note on Secrets: the controller SA is NEVER granted
# secret read at any level. The receive-adapter Pod kubelet-dereferences
# the API key Secret via SecretKeyRef in the YipYapSource's own namespace.
# Adding a Secret rule here (at any scope) would be a posture regression.

---
# Aggregated source-observer role: grants read-only access to YipYapSources
# under the Knative Eventing source duck.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yipyap-source-observer
  labels:
    {{- include "yipyap-source.labels" . | nindent 4 }}
    duck.knative.dev/source: "true"
rules:
  - apiGroups: ["sources.eventing.knative.dev"]
    resources: ["yipyapsources"]
    verbs: ["get", "list", "watch"]
