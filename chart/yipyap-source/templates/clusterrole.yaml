apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "yipyap-source.controllerServiceAccountName" . }}
  labels:
    {{- include "yipyap-source.labels" . | nindent 4 }}
rules:
  # Adapter Deployments. The controller's Deployment informer lists and
  # watches every namespace, so get/list/watch stay cluster-wide in both
  # modes. With controller.scopedNamespaces empty (default) the write verbs
  # are cluster-wide too. With it set, the writes live only in the
  # per-namespace Roles from scoped-roles.yaml.
  #
  # No configmaps rule: the controller reads only its own config ConfigMaps,
  # in the release namespace (controller-role.yaml).
  {{- if .Values.controller.scopedNamespaces }}
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  {{- else }}
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Adapter pods: list only, to find a source's adapter pod and read its
  # status endpoint for the Connected condition. No get, watch or writes.
  # This is a direct per-namespace call, not an informer, so scoping moves
  # it into the per-namespace Roles.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]

  # Per-source OIDC ServiceAccounts, made only for a sink with an OIDC
  # audience. Get and create only: the controller never updates, deletes
  # (owner references let GC do that) or mints tokens for them. Direct
  # per-namespace calls, so scoping moves this into the per-namespace Roles.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create"]
  {{- end }}

  # The event recorder only creates events and patches the count on repeats.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "update", "patch"]

  - apiGroups: ["sources.yipyap.run"]
    resources: ["yipyapsources"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["sources.yipyap.run"]
    resources: ["yipyapsources/status", "yipyapsources/finalizers"]
    verbs: ["get", "update", "patch"]

# Leader-election leases and the controller's own config ConfigMaps live in
# the release namespace only; see controller-role.yaml.

# No secrets rule at any scope. The controller never reads Secret values:
# the receive-adapter Pod resolves the API key Secret in its own namespace
# through SecretKeyRef. Do not add a Secret rule here.

---
# Aggregated source-observer role: grants read-only access to YipYapSources
# under the Knative Eventing source duck.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yipyap-source-observer
  labels:
    {{- include "yipyap-source.labels" . | nindent 4 }}
    duck.knative.dev/source: "true"
rules:
  - apiGroups: ["sources.yipyap.run"]
    resources: ["yipyapsources"]
    verbs: ["get", "list", "watch"]
