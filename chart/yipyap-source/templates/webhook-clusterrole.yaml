apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "yipyap-source.webhookServiceAccountName" . }}
  labels:
    {{- include "yipyap-source.labels" . | nindent 4 }}
rules:
  - apiGroups: ["sources.yipyap.run"]
    resources: ["yipyapsources"]
    verbs: &everything ["get", "list", "watch", "create", "update", "patch", "delete"]

  - apiGroups: ["sources.yipyap.run"]
    resources: ["yipyapsources/finalizers"]
    verbs: *everything

  - apiGroups: ["sources.yipyap.run"]
    resources: ["yipyapsources/status"]
    verbs: ["get", "update", "patch"]

  # Webhook does not reconcile Deployments — that's the controller's job.
  # Previously granted CRUD; removed as unused (security-review H-7).

  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]

  # Webhook reads ONLY its own (system) namespace at startup to attach
  # OwnerReferences to its admission ConfigMaps + ValidatingWebhookConfigs.
  # The upstream knative.dev/pkg webhook never calls Patch/Update on
  # Namespaces; the round-1 grant of patch+list+watch was over-permissive.
  # Scope by resourceNames to the chart's release namespace
  # (security-review A6-N-2).
  - apiGroups: [""]
    resources: ["namespaces"]
    resourceNames:
      - {{ include "yipyap-source.namespace" . | quote }}
    verbs: ["get"]

  - apiGroups: [""]
    resources: ["events", "configmaps"]
    verbs: *everything

  - apiGroups: ["eventing.knative.dev"]
    resources: ["eventtypes"]
    verbs: *everything

  # Webhook manages its own cert secret.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "list", "watch"]

  # Webhook registration — scoped to this source's own webhookconfigurations
  # (security-review H-8). The Knative cert controller needs get+update+patch
  # to inject the CA bundle into its own admission configs; it never needs
  # list/create/delete or access to any other webhook configs in the cluster.
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    resourceNames:
      - "defaulting.webhook.sources.yipyap.run"
      - "validation.webhook.sources.yipyap.run"
      - "config.webhook.sources.yipyap.run"
    verbs: ["get", "update", "patch"]

  # Leader election.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: *everything
