{{- /*
Per-namespace Role + RoleBinding pairs that hold the controller's write
access when `controller.scopedNamespaces` is non-empty.

Each listed namespace gets create/update/patch/delete on Deployments, list
on Pods and get/create on ServiceAccounts (per-source OIDC identities). Reads stay cluster-wide on the ClusterRole (clusterrole.yaml)
because the Deployment and YipYapSource informers list and watch every
namespace; a namespaced Role cannot satisfy a cluster-wide list, and without
it the informer cache never syncs.

Leader-election leases and the controller's own config ConfigMaps are
granted in the release namespace by controller-role.yaml whether or not the
release namespace is listed here. Secrets are not granted at any level: the
receive-adapter Pod resolves SecretKeyRef in its own namespace via kubelet.
*/}}
{{- with .Values.controller.scopedNamespaces }}
{{- $sa := include "yipyap-source.controllerServiceAccountName" $ -}}
{{- $saNamespace := include "yipyap-source.namespace" $ -}}
{{- $labels := include "yipyap-source.labels" $ -}}
{{- range $ns := . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $sa }}-scoped
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
rules:
  # Reads come from the cluster-wide ClusterRole; only writes are scoped.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "update", "patch", "delete"]
  # Find the adapter pod and read its status endpoint (Connected condition).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # Per-source OIDC ServiceAccounts for sinks with an OIDC audience.
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $sa }}-scoped
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $sa }}-scoped
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ $saNamespace }}
{{- end }}
{{- end }}
