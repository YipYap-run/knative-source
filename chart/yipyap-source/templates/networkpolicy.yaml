{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy for the controller pod.
#
# Ingress: controller is never called by external clients (no Service exposed
# outside metrics). Metrics scraping from the observability stack is allowed
# ONLY when the operator has labeled their monitoring namespace explicitly —
# see metrics.networkPolicy.ingressFromNamespaceLabels. Default-deny: if no
# selector is configured, no metrics ingress rule is rendered, so scraping
# is blocked from every other pod in the cluster (security-review A6-N-1
# round-2 follow-up: prior version rendered `from: []` which is wide-open
# in NetworkPolicy semantics).
#
# Egress: kube-apiserver (for informers + reconcile writes) and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yipyap-source-controller
  namespace: {{ include "yipyap-source.namespace" . }}
  labels:
    {{- include "yipyap-source.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: yipyap-source-controller
      control-plane: yipyap-source-controller-manager
  policyTypes: [Ingress, Egress]
  ingress:
    {{- if and .Values.metrics.enabled .Values.metrics.networkPolicy.ingressFromNamespaceLabels }}
    # Metrics scrapers, label-scoped (security-review A6-N-1).
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.metrics.networkPolicy.ingressFromNamespaceLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
    {{- end }}
  egress:
    # DNS.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # kube-apiserver (typically on 443 or 6443).
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# NetworkPolicy for the webhook pod.
#
# Ingress:
#   * kube-apiserver calls the webhook admission endpoint on :8443. The
#     apiserver IP is not a stable NetworkPolicy selector across cluster
#     topologies, so this single rule does allow `from: []` (any peer) —
#     scoped to the admission port. Operators who can pin their apiserver
#     to a known IP / namespace should override this template.
#   * Metrics scraping is gated on metrics.networkPolicy.ingressFromNamespaceLabels;
#     no rule is rendered when the labels are empty (default-deny — the
#     same A6-N-1 follow-up applied to the controller).
#
# Egress: kube-apiserver + DNS (the webhook patches its own CA bundle into
# the admission configurations on startup).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: yipyap-source-webhook
  namespace: {{ include "yipyap-source.namespace" . }}
  labels:
    {{- include "yipyap-source.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: yipyap-source-webhook
      role: yipyap-source-webhook
  policyTypes: [Ingress, Egress]
  ingress:
    # kube-apiserver callback.
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.webhook.port }}
    {{- if and .Values.metrics.enabled .Values.metrics.networkPolicy.ingressFromNamespaceLabels }}
    # Metrics scrapers, label-scoped (security-review A6-N-1).
    - from:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.metrics.networkPolicy.ingressFromNamespaceLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.metrics.port }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
{{- end }}
