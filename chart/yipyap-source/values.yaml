# Default values for yipyap-source.
# This is a YAML-formatted file. Values may be overridden via --set or a custom values file.

# Namespace where the controller + webhook run.
namespace:
  create: true
  name: yipyap-sources

# Container images.
images:
  controller:
    repository: ghcr.io/yipyap-run/knative-source-controller
    # If empty, falls back to .Chart.AppVersion.
    tag: ""
    pullPolicy: IfNotPresent
  webhook:
    repository: ghcr.io/yipyap-run/knative-source-webhook
    tag: ""
    pullPolicy: IfNotPresent
  # Adapter (receive-adapter) image deployed per-YipYapSource by the controller.
  # Set via the YIPYAP_SOURCE_RA_IMAGE env var on the controller Deployment.
  adapter:
    repository: ghcr.io/yipyap-run/knative-source-receive-adapter
    tag: ""

# Controller Deployment.
controller:
  replicas: 1
  # scopedNamespaces narrows the controller SA's namespace-scoped permissions
  # (Deployments, ConfigMaps) from cluster-wide to a per-namespace Role +
  # RoleBinding pair for each entry.

  # Behaviour:
  #   * Empty list (default) — apps/deployments + core/configmaps grants
  #     are emitted CLUSTER-WIDE on the ClusterRole (canonical Knative
  #     source pattern; reconcile against any namespace).
  #   * Non-empty list — the cluster-wide grants are REMOVED from the
  #     ClusterRole and emitted ONLY as Role + RoleBinding pairs against
  #     the listed namespaces. Reconciles against any other namespace
  #     fail closed with RBAC-denied.

  # The controller SA is NEVER granted Secret read at any level. The
  # receive-adapter Pod kubelet-resolves SecretKeyRef in the YipYapSource's
  # own namespace.

  # Example: scopedNamespaces: ["team-a", "team-b"]
  scopedNamespaces: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Webhook Deployment (validating + mutating admission).
webhook:
  # Two replicas so webhook failurePolicy: Fail does not become a SPOF during
  # rolling updates or node drains. A matching PodDisruptionBudget with
  # minAvailable=1 is rendered automatically when replicas > 1.
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # failurePolicy: Fail = reject CRD writes if webhook is unavailable.
  # Set to Ignore if you want best-effort admission (not recommended).
  failurePolicy: Fail
  # Port the webhook listens on (canonical 8443).
  port: 8443
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Metrics exposed for Prometheus scraping (controller + webhook).
metrics:
  enabled: true
  port: 9090
  # NetworkPolicy ingress for the metrics endpoint.
  # Default is DENY — when the labels map is empty, no ingress rule is
  # rendered for the metrics port and scraping is blocked from every other
  # pod in the cluster. Operators who scrape with Prometheus must set:

  #   networkPolicy:
  #     ingressFromNamespaceLabels:
  #       kubernetes.io/metadata.name: monitoring

  # which renders an ingress rule restricted to namespaces carrying the
  # listed labels. Multiple key/value pairs are AND-combined within the
  # single namespaceSelector.
  networkPolicy:
    ingressFromNamespaceLabels: {}

# ServiceAccount names (for custom SA bindings).
serviceAccounts:
  controller:
    name: yipyap-source-controller
    create: true
  webhook:
    name: yipyap-source-webhook
    create: true

# Logging config (maps to the config-logging ConfigMap).
logging:
  level: info
  zap-logger-config: |
    {
      "level": "info",
      "development": false,
      "outputPaths": ["stdout"],
      "errorOutputPaths": ["stderr"],
      "encoding": "json",
      "encoderConfig": {
        "timeKey": "ts",
        "levelKey": "level",
        "nameKey": "logger",
        "callerKey": "caller",
        "messageKey": "msg",
        "stacktraceKey": "stacktrace",
        "lineEnding": "",
        "levelEncoder": "",
        "timeEncoder": "iso8601",
        "durationEncoder": "",
        "callerEncoder": ""
      }
    }

# Priority class for the controller + webhook pods.
priorityClassName: ""

# CRD install toggle. Set false if you manage CRDs separately (e.g. via Argo/Flux).
installCRD: true

# NetworkPolicy for controller + webhook pods. Set to false in clusters
# without a NetworkPolicy-aware CNI (some bare kubeadm installs) or when you
# manage NetworkPolicies out-of-band.
networkPolicy:
  enabled: true
