# Default values for yipyap-source.
# This is a YAML-formatted file. Values may be overridden via --set or a custom values file.

# Namespace where the controller + webhook run. With create=true everything
# goes into namespace.name. The chart creates that namespace only when it
# differs from the release namespace and does not exist yet; the release
# namespace itself comes from helm install --create-namespace.
namespace:
  create: true
  name: yipyap-sources

# Container images.
# digest (sha256:<64 hex>) pins an image by content: the chart then deploys
# repository@digest. Published charts ship with the digests of the images
# the release built, so a chart version always deploys the same bytes. To
# deploy by tag instead, set both tag and digest: "".
images:
  controller:
    repository: ghcr.io/yipyap-run/knative-source-controller
    # If empty, falls back to .Chart.AppVersion.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  webhook:
    repository: ghcr.io/yipyap-run/knative-source-webhook
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Adapter (receive-adapter) image deployed per-YipYapSource by the controller.
  # Set via the YIPYAP_SOURCE_RA_IMAGE env var on the controller Deployment.
  adapter:
    repository: ghcr.io/yipyap-run/knative-source-receive-adapter
    tag: ""
    digest: ""

# Controller Deployment.
controller:
  replicas: 1
  # scopedNamespaces limits where the controller may create, update, patch
  # and delete adapter Deployments (and list adapter Pods). Entries must be
  # distinct, valid namespace names; the schema rejects anything else.
  #
  # Behaviour:
  #   * Empty list (default): those write verbs are granted CLUSTER-WIDE on
  #     the ClusterRole, so sources reconcile in any namespace.
  #   * Non-empty list: the write verbs are granted ONLY through a Role +
  #     RoleBinding in each listed namespace. A YipYapSource in any other
  #     namespace is still seen, but its adapter Deployment cannot be
  #     created; the source stays NotReady with an RBAC error.
  #
  # What scoping does NOT restrict:
  #   * Reads. get/list/watch on Deployments and YipYapSources stay
  #     cluster-wide, because the controller's informers list and watch every
  #     namespace. The controller can still read every Deployment's spec.
  #   * Events (create/patch) and YipYapSource status writes, which are
  #     cluster-wide so the controller can report on sources anywhere.
  #   * The release namespace. The controller always gets configmaps read
  #     and leader-election leases there (controller-role.yaml), whether or
  #     not it is listed. List it only if sources live in it.
  #
  # The controller SA is NEVER granted Secret read at any level. The
  # receive-adapter Pod kubelet-resolves SecretKeyRef in the YipYapSource's
  # own namespace.

  # Example: scopedNamespaces: ["team-a", "team-b"]
  scopedNamespaces: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Webhook Deployment (validating + mutating admission).
webhook:
  # Two replicas so webhook failurePolicy: Fail does not become a SPOF during
  # rolling updates or node drains. A matching PodDisruptionBudget with
  # minAvailable=1 is rendered automatically when replicas > 1.
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  # failurePolicy: Fail = reject CRD writes if webhook is unavailable.
  # Set to Ignore if you want best-effort admission (not recommended).
  failurePolicy: Fail
  # Port the webhook listens on (canonical 8443).
  port: 8443
  # Hosts a YipYapSource spec.baseURL may point at. The adapter sends the
  # API key from spec.apiKeyRef to that URL, so only list YipYap endpoints
  # you trust. The webhook rejects other hosts, plain http and URLs with
  # user info, and the controller keeps such sources not ready. Entries:
  #   console.yipyap.run      exact host, default https port (443)
  #   yipyap.internal:8443    exact host on port 8443
  #   "*.yipyap.example.com"  any subdomain (not the apex), port 443
  # Matching is case-insensitive. The list must not be empty.
  allowedBaseURLHosts:
    - console.yipyap.run
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Metrics exposed for Prometheus scraping (controller + webhook).
metrics:
  enabled: true
  port: 9090
  # NetworkPolicy ingress for the metrics endpoint.
  # Default is DENY: when the labels map is empty, no ingress rule is
  # rendered for the metrics port and scraping is blocked from every other
  # pod in the cluster. Operators who scrape with Prometheus must set:

  #   networkPolicy:
  #     ingressFromNamespaceLabels:
  #       kubernetes.io/metadata.name: monitoring

  # which renders an ingress rule restricted to namespaces carrying the
  # listed labels. Multiple key/value pairs are AND-combined within the
  # single namespaceSelector.
  networkPolicy:
    ingressFromNamespaceLabels: {}

# ServiceAccount names (for custom SA bindings).
serviceAccounts:
  controller:
    name: yipyap-source-controller
    create: true
  webhook:
    name: yipyap-source-webhook
    create: true

# Logging config (maps to the config-logging ConfigMap).
logging:
  level: info
  zap-logger-config: |
    {
      "level": "info",
      "development": false,
      "outputPaths": ["stdout"],
      "errorOutputPaths": ["stderr"],
      "encoding": "json",
      "encoderConfig": {
        "timeKey": "ts",
        "levelKey": "level",
        "nameKey": "logger",
        "callerKey": "caller",
        "messageKey": "msg",
        "stacktraceKey": "stacktrace",
        "lineEnding": "",
        "levelEncoder": "",
        "timeEncoder": "iso8601",
        "durationEncoder": "",
        "callerEncoder": ""
      }
    }

# Priority class for the controller + webhook pods.
priorityClassName: ""

# CRD install toggle. Set false if you manage CRDs separately (e.g. via Argo/Flux).
installCRD: true

# NetworkPolicy for controller + webhook pods. On by default. Set enabled to
# false in clusters without a NetworkPolicy-aware CNI or when you manage
# NetworkPolicies out-of-band.

# The kube-apiserver runs on a host or external IP, which pod and namespace
# selectors never match, so its address range must be given as CIDRs. With
# enabled=true and apiServerCIDRs empty, install fails with an error (unless
# cilium.useEntities is true). Find the addresses with:

#   kubectl get endpoints kubernetes -n default

# and list each one as /32 (IPv4) or /128 (IPv6), or give the control plane
# subnet. Example:

#   networkPolicy:
#     apiServerCIDRs: ["172.18.0.2/32"]
networkPolicy:
  enabled: true
  # CIDRs of the kube-apiserver endpoints. Controller and webhook egress to
  # the API server is allowed only to these ranges.
  apiServerCIDRs: []
  # TCP ports the API server endpoints listen on (443 on most managed
  # control planes, 6443 on kubeadm, k3s and kind).
  apiServerPorts: [443, 6443]
  # Source CIDRs allowed to call the webhook admission port. Empty means
  # apiServerCIDRs. Set this when the API server reaches webhooks from a
  # different range than the one it serves on (for example a managed
  # control plane that connects from a separate subnet).
  webhookIngressCIDRs: []
  cilium:
    # Also render CiliumNetworkPolicy objects that allow the Cilium
    # kube-apiserver entity (egress from both pods, ingress to the webhook
    # port). Requires the cilium.io/v2 CRDs. When true, apiServerCIDRs may be
    # left empty.
    useEntities: false
