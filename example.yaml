# Placeholder example for sources.yipyap.run/v1alpha1 YipYapSource.
#
# The canonical reference example lands in Task 4.11 alongside Phase 4 docs.
# This file exists so downstream Helm tooling and docs can `kubectl apply -f`
# a minimal working CR during the Phase 4 bring-up.

apiVersion: sources.yipyap.run/v1alpha1
kind: YipYapSource
metadata:
  name: yipyap-source-example
  namespace: yipyap-sources
spec:
  # The Knative sink to which YipYap CloudEvents will be delivered.
  sink:
    ref:
      apiVersion: eventing.knative.dev/v1
      kind: Broker
      name: default
