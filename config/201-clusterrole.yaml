apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yipyap-source-controller
  labels:
    sources.yipyap.run/release: devel
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs: &everything
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - clusterroles
  verbs:
  - list

- apiGroups:
  - ""
  resources:
  - events
  verbs: *everything

- apiGroups:
  - sources.yipyap.run
  resources:
  - yipyapsources
  verbs: *everything

- apiGroups:
  - sources.yipyap.run
  resources:
  - yipyapsources/status
  - yipyapsources/finalizers
  verbs:
  - get
  - update
  - patch

# ConfigMaps are needed cluster-wide for Knative-style observability config
# discovery. Secrets are NOT included here: the controller never reads
# Secret values in-process. The receive-adapter Pod kubelet-dereferences
# the API key Secret in its own namespace via SecretKeyRef. Cluster-wide
# secret read on the controller SA is therefore unused (security-review H-6).
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch

  # For Leader Election
- apiGroups:
    - coordination.k8s.io
  resources:
    - leases
  verbs: *everything

---
# The role is needed for the aggregated role source-observer in knative-eventing to provide readonly access to "Sources".
# See https://github.com/knative/eventing/blob/master/config/200-source-observer-clusterrole.yaml.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: yipyap-source-observer
  labels:
    sources.yipyap.run/release: devel
    duck.knative.dev/source: "true"
rules:
  - apiGroups:
      - "sources.eventing.knative.dev"
    resources:
      - "yipyapsources"
    verbs:
      - get
      - list
      - watch
