apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yipyap-source-controller
  labels:
    sources.yipyap.run/release: devel
rules:
- apiGroups:
  - apps
  resources:
  - deployments
  verbs: &everything
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

# Adapter pods: list only, to find a source's adapter pod and read its
# status endpoint for the Connected condition. No get, watch or writes.
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - list

# Per-source OIDC ServiceAccounts, made only for a sink with an OIDC
# audience. Get and create only: the controller never updates, deletes
# (owner references let GC do that) or mints tokens for them.
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
  - create

# The event recorder only creates events and patches the count on repeats.
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - update
  - patch

- apiGroups:
  - sources.yipyap.run
  resources:
  - yipyapsources
  verbs: *everything

- apiGroups:
  - sources.yipyap.run
  resources:
  - yipyapsources/status
  - yipyapsources/finalizers
  verbs:
  - get
  - update
  - patch

# No configmaps or secrets rule. The controller reads only its own config
# ConfigMaps, in the release namespace (Role below), and never reads Secret
# values: the receive-adapter Pod resolves the API key Secret in its own
# namespace through SecretKeyRef.

---
# Leader election takes a Lease in the release namespace only (client-go
# LeaseLock: get, create, update). Keep it out of the ClusterRole so a
# compromised controller cannot take over other components' leases.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yipyap-source-controller
  namespace: yipyap-sources
  labels:
    sources.yipyap.run/release: devel
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - create
  - update
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch

---
# The role is needed for the aggregated role source-observer in knative-eventing to provide readonly access to "Sources".
# See https://github.com/knative/eventing/blob/master/config/200-source-observer-clusterrole.yaml.
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: yipyap-source-observer
  labels:
    sources.yipyap.run/release: devel
    duck.knative.dev/source: "true"
rules:
  - apiGroups:
      - "sources.yipyap.run"
    resources:
      - "yipyapsources"
    verbs:
      - get
      - list
      - watch
