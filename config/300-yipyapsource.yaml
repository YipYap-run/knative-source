apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    sources.yipyap.run/release: devel
    eventing.knative.dev/source: "true"
    knative.dev/crd-install: "true"
  annotations:
    registry.knative.dev/eventTypes: |
      [
        { "type": "run.yipyap.alert.fired.v1" },
        { "type": "run.yipyap.alert.acknowledged.v1" },
        { "type": "run.yipyap.alert.resolved.v1" },
        { "type": "run.yipyap.alert.escalated.v1" },
        { "type": "run.yipyap.monitor.up.v1" },
        { "type": "run.yipyap.monitor.down.v1" },
        { "type": "run.yipyap.monitor.degraded.v1" },
        { "type": "run.yipyap.monitor.heartbeat_missed.v1" },
        { "type": "run.yipyap.maintenance.started.v1" },
        { "type": "run.yipyap.maintenance.ended.v1" }
      ]
  name: yipyapsources.sources.yipyap.run
spec:
  group: sources.yipyap.run
  versions:
    - &version
      name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          # Static schema floor, enforced by the apiserver even when the
          # admission webhook is unavailable or set to failurePolicy=Ignore.
          #
          # Do not add `additionalProperties: false` next to `properties`:
          # the apiserver rejects the CRD because the two are mutually
          # exclusive. Listing `properties` already makes the apiserver drop
          # unknown fields, or reject them under strict field validation
          # (the kubectl default). test/crd checks this file against the
          # chart CRD and the apiserver's CRD rules.
          #
          # `required: [spec]` at root is also illegal when the status
          # subresource is enabled: the apiserver issues status-only writes
          # that omit spec, which root-required would reject. spec-presence
          # is enforced by the admission webhook instead.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [apiKeyRef]
              properties:
                apiKeyRef:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                    key:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[A-Za-z0-9._-]+$'
                baseURL:
                  type: string
                  maxLength: 2048
                  # https only. The admission webhook also requires the host
                  # to be on the operator allowlist and rejects user info.
                  pattern: '^https://[^\s]+$'
                mode:
                  type: string
                  enum: ["", auto, poll, stream]
                serviceAccountName:
                  description: >-
                    ServiceAccount the adapter pod runs as. When unset, the
                    pod uses the namespace's default ServiceAccount. No API
                    token is mounted. For a sink with an OIDC audience the
                    pod runs as a generated per-source ServiceAccount and
                    takes only this account's imagePullSecrets.
                  type: string
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                filter:
                  type: object
                  properties:
                    types:
                      type: array
                      maxItems: 1024
                      items:
                        type: string
                        minLength: 1
                        maxLength: 256
                    monitorIDs:
                      type: array
                      maxItems: 1024
                      items:
                        type: string
                        minLength: 1
                        maxLength: 256
                    severities:
                      type: array
                      maxItems: 3
                      items:
                        type: string
                        enum: [info, warning, critical]
                sink:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                ceOverrides:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: ".status.conditions[?(@.type=='Ready')].status"
        - name: Reason
          type: string
          jsonPath: ".status.conditions[?(@.type=='Ready')].reason"
        - name: Message
          type: string
          priority: 1
          jsonPath: ".status.conditions[?(@.type=='Ready')].message"
        - name: Sink
          type: string
          jsonPath: .status.sinkUri
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  names:
    categories:
    - all
    - knative
    - eventing
    - sources
    kind: YipYapSource
    plural: yipyapsources
    singular: yipyapsource
    shortNames:
    - yys
  scope: Namespaced
