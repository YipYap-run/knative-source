apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    sources.yipyap.run/release: devel
    eventing.knative.dev/source: "true"
    knative.dev/crd-install: "true"
  annotations:
    registry.knative.dev/eventTypes: |
      [
        { "type": "dev.yipyap.source" }
      ]
  name: yipyapsources.sources.yipyap.run
spec:
  group: sources.yipyap.run
  versions:
    - &version
      name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          # Static schema floor. Unknown fields are rejected at
          # apiserver-side validation even when the admission webhook is
          # unavailable / failurePolicy=Ignore.
          #
          # `additionalProperties: false` is FORBIDDEN by the Kubernetes
          # structural-schema rules when the status subresource is enabled
          # (the apiserver rejects the CRD registration). We rely on the
          # implicit strict default instead.
          #
          # `required: [spec]` at root is also illegal when the status
          # subresource is enabled: the apiserver issues status-only writes
          # that omit spec, which root-required would reject. spec-presence
          # is enforced by the admission webhook instead.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [apiKeyRef]
              additionalProperties: false
              properties:
                apiKeyRef:
                  type: object
                  required: [name]
                  additionalProperties: false
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                    key:
                      type: string
                      minLength: 1
                      maxLength: 253
                      pattern: '^[A-Za-z0-9._-]+$'
                baseURL:
                  type: string
                  maxLength: 2048
                  pattern: '^https?://[^\s]+$'
                mode:
                  type: string
                  enum: ["", auto, poll, stream]
                serviceAccountName:
                  type: string
                  maxLength: 253
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                filter:
                  type: object
                  additionalProperties: false
                  properties:
                    types:
                      type: array
                      maxItems: 1024
                      items:
                        type: string
                        minLength: 1
                        maxLength: 256
                    monitorIDs:
                      type: array
                      maxItems: 1024
                      items:
                        type: string
                        minLength: 1
                        maxLength: 256
                    severities:
                      type: array
                      maxItems: 8
                      items:
                        type: string
                        enum: [info, warning, critical]
                sink:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                ceOverrides:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: ".status.conditions[?(@.type=='Ready')].status"
        - name: Reason
          type: string
          jsonPath: ".status.conditions[?(@.type=='Ready')].reason"
        - name: Sink
          type: string
          jsonPath: .status.sinkUri
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  names:
    categories:
    - all
    - knative
    - eventing
    - sources
    kind: YipYapSource
    plural: yipyapsources
    singular: yipyapsource
    shortNames:
    - yys
  scope: Namespaced
