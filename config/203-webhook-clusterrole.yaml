apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yipyap-source-webhook
  labels:
    sources.yipyap.run/release: devel
rules:
  # Admission only reads YipYapSources. It never writes them, their status
  # or their finalizers; that is the controller's job.
  - apiGroups:
      - sources.yipyap.run
    resources:
      - yipyapsources
    verbs:
      - get
      - list
      - watch

  # The webhook reads ONLY its own (system) namespace at startup to attach
  # OwnerReferences to its webhook configurations. Scoped by resourceNames
  # to the release namespace.
  - apiGroups:
      - ""
    resources:
      - namespaces
    resourceNames:
      - "yipyap-sources"
    verbs:
      - get

  # Validation asks the API server whether the requesting user may get the
  # Secret named by spec.apiKeyRef, so a user cannot point the adapter at a
  # Secret they cannot read themselves.
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create

  # No events rule: the knative.dev/pkg webhook, certificate and
  # leader-election code paths never record Kubernetes events.

  # The defaulting, validation and configmaps admission controllers use
  # cluster-wide webhook configuration informers. An informer issues an
  # unfiltered LIST and WATCH, which resourceNames cannot authorize, so
  # without this rule the informers never sync and every admission request
  # hangs.
  - apiGroups:
      - "admissionregistration.k8s.io"
    resources:
      - "mutatingwebhookconfigurations"
      - "validatingwebhookconfigurations"
    verbs:
      - "list"
      - "watch"

  # Writes stay restricted to this source's own webhook configurations. The
  # reconcilers need get, update and patch to inject the CA bundle and rules.
  - apiGroups:
      - "admissionregistration.k8s.io"
    resources:
      - "mutatingwebhookconfigurations"
      - "validatingwebhookconfigurations"
    resourceNames:
      - "defaulting.webhook.sources.yipyap.run"
      - "validation.webhook.sources.yipyap.run"
      - "config.webhook.sources.yipyap.run"
    verbs:
      - "get"
      - "update"
      - "patch"

---
# Release-namespace grants. The knative.dev/pkg webhook reads its
# serving-cert Secret through the namespacedkube informer (scoped to
# SYSTEM_NAMESPACE), the certificates reconciler updates that one Secret,
# sharedmain reads its config ConfigMaps from the same namespace, and leader
# election takes a Lease there. None of this needs cluster-wide access.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: yipyap-source-webhook
  namespace: yipyap-sources
  labels:
    sources.yipyap.run/release: devel
rules:
  # Informer list/watch cannot be narrowed by name.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - list
      - watch
  # The Secret ships with the install; the webhook only fills it in.
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - yipyap-source-webhook-certs
    verbs:
      - get
      - update
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - get
      - create
      - update
