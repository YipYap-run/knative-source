apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: yipyap-source-webhook
  labels:
    sources.yipyap.run/release: devel
rules:
  # Sources admin
  - apiGroups:
      - sources.yipyap.run
    resources:
      - yipyapsources
    verbs: &everything
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete

  # Sources finalizer
  - apiGroups:
      - sources.yipyap.run
    resources:
      - yipyapsources/finalizers
    verbs: *everything

  # Source statuses update
  - apiGroups:
      - sources.yipyap.run
    resources:
      - yipyapsources/status
    verbs:
      - get
      - update
      - patch

  # Webhook does NOT reconcile Deployments — that's the controller's job.

  # Service read for webhook target service discovery.
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - watch

  # Webhook reads ONLY its own (system) namespace at startup to attach
  # OwnerReferences to its admission ConfigMaps + ValidatingWebhookConfigs.
  # The upstream knative.dev/pkg webhook never calls Patch/Update on
  # Namespaces. Scope by resourceNames to the
  # release namespace.
  - apiGroups:
      - ""
    resources:
      - namespaces
    resourceNames:
      - "yipyap-sources"
    verbs:
      - get

  # Events admin + ConfigMaps for observability discovery.
  - apiGroups:
      - ""
    resources:
      - events
      - configmaps
    verbs: *everything

  # EventTypes admin
  - apiGroups:
      - eventing.knative.dev
    resources:
      - eventtypes
    verbs: *everything

  # Webhook manages its own cert secret only.
  - apiGroups:
      - ""
    resources:
      - "secrets"
    verbs:
      - "get"
      - "create"
      - "update"
      - "list"
      - "watch"

  # Webhook registration scoped to this source's own webhookconfigurations
  # only. Cert controller needs get/update/patch to
  # inject the CA bundle; never list/create/delete or other configs.
  - apiGroups:
      - "admissionregistration.k8s.io"
    resources:
      - "mutatingwebhookconfigurations"
      - "validatingwebhookconfigurations"
    resourceNames:
      - "defaulting.webhook.sources.yipyap.run"
      - "validation.webhook.sources.yipyap.run"
      - "config.webhook.sources.yipyap.run"
    verbs:
      - "get"
      - "update"
      - "patch"

  # For Leader Election
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs: *everything
