# MutatingWebhookConfiguration: runs SetDefaults() on every YipYapSource.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: defaulting.webhook.sources.yipyap.run
  labels:
    sources.yipyap.run/release: devel
webhooks:
  - name: defaulting.webhook.sources.yipyap.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: yipyap-source-webhook
        namespace: yipyap-sources
        path: /defaulting
    rules:
      - apiGroups:   ["sources.yipyap.run"]
        apiVersions: ["v1alpha1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["yipyapsources"]
        scope:       "Namespaced"

---
# ValidatingWebhookConfiguration: runs Validate() on every YipYapSource.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validation.webhook.sources.yipyap.run
  labels:
    sources.yipyap.run/release: devel
webhooks:
  - name: validation.webhook.sources.yipyap.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: yipyap-source-webhook
        namespace: yipyap-sources
        path: /resource-validation
    rules:
      - apiGroups:   ["sources.yipyap.run"]
        apiVersions: ["v1alpha1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["yipyapsources"]
        scope:       "Namespaced"

---
# ValidatingWebhookConfiguration: validates our pinned ConfigMaps so bad
# logging/observability configs are rejected at write time.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: config.webhook.sources.yipyap.run
  labels:
    sources.yipyap.run/release: devel
webhooks:
  - name: config.webhook.sources.yipyap.run
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 10
    clientConfig:
      service:
        name: yipyap-source-webhook
        namespace: yipyap-sources
        path: /config-validation
    namespaceSelector:
      matchExpressions:
        - key: sources.yipyap.run/release
          operator: Exists
    objectSelector:
      matchLabels:
        app.kubernetes.io/component: yipyap-source
    rules:
      - apiGroups:   [""]
        apiVersions: ["v1"]
        operations:  ["CREATE", "UPDATE"]
        resources:   ["configmaps"]
        scope:       "Namespaced"

---
# Webhook-cert Secret. Populated at startup by knative.dev/pkg/webhook/certificates
# Self-signs a CA; no cert-manager dependency.
apiVersion: v1
kind: Secret
metadata:
  name: yipyap-source-webhook-certs
  namespace: yipyap-sources
  labels:
    sources.yipyap.run/release: devel
# The data is populated at install time by the webhook itself.
