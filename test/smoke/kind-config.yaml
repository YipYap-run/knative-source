# kind cluster for the smoke and conformance jobs.

# The default kind CNI is turned off so smoke.sh can install Calico, which
# enforces NetworkPolicy. The chart's NetworkPolicy is on by default, so the
# smoke job only proves an install works if the policy is enforced.
# 192.168.0.0/16 is the Calico default pool and does not overlap the kind
# node network (172.18.0.0/16 by default).
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
